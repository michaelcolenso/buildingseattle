name = "buildingseattle"
main = "site_worker.js"
compatibility_date = "2026-03-14"

[triggers]
crons = ["0 13 * * *"]

# Persist Workers Logs so the next GitHub auto-deploy does not wipe
# script-settings observability (enabled live 2026-09-05 via API).
[observability]
enabled = true
head_sampling_rate = 1

  [observability.logs]
  enabled = true
  invocation_logs = true
  head_sampling_rate = 1

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "buildingseattle"
database_id = "e065e988-045f-42b5-b47a-4027c2e5c417"  # Replace with your actual ID from Dashboard

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["alerts@buildingseattle.com"]
