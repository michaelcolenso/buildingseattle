name: Development Site Enrichment

on:
  schedule:
    - cron: '0 15 * * *' # 7 AM PST / 8 AM PDT, after the permit enrichment window
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and report coverage without publishing'
        type: boolean
        default: true
      limit_sites:
        description: 'Maximum sites for a pilot (0 = all)'
        default: '0'
        required: false

permissions:
  contents: read

concurrency:
  group: development-site-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    # Enable this repository variable only after migration, pilot, and backfill.
    if: github.event_name == 'workflow_dispatch' || vars.DEVELOPMENT_SITES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv sync --frozen
      - name: Refresh development sites
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT_SITES: ${{ inputs.limit_sites || '0' }}
        run: |
          args=(--limit-sites "$LIMIT_SITES")
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          uv run python scripts/enrich_development_sites.py "${args[@]}"

  notify:
    needs: [enrich]
    # Skipped runs (repository variable off) are not failures.
    if: always() && needs.enrich.result != 'skipped'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      result: ${{ needs.enrich.result }}
