name: Data Freshness

# Fails when production data has gone stale: the newest permit
# issued/applied date in /api/stats is older than 4 days, or the last
# successful ingest is older than 36 hours. Reads only the public
# /api/stats endpoint; needs no secrets. A failure opens (or comments on)
# a "[Workflow failure] Data Freshness" issue; the next pass closes it.

on:
  schedule:
    - cron: '0 16 * * *' # after the 13:00 Worker ingest and 14:00 enrichment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Check data freshness
        env:
          BUILDINGSEATTLE_URL: https://buildingseattle.com
        shell: bash
        run: |
          set +e
          python scripts/check_freshness.py > freshness.txt
          status=$?
          { echo '```'; cat freshness.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat freshness.txt
          exit "$status"

  notify:
    needs: [check]
    if: always() && needs.check.result != 'skipped'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      result: ${{ needs.check.result }}
