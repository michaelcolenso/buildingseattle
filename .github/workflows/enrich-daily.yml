name: Daily Permit Enrichment

# Runs scripts/enrich_unenriched.py once a day. Picks up where the
# Worker scheduled ingest leaves off: the Worker fetches base permit
# rows from the Seattle Open Data feed at 13:00 UTC, then this job
# enriches the newest un-enriched permits an hour later by scraping
# SDCI detail pages + resolving WA L&I licenses, and re-enriches a
# bounded rotation of stale permits (see scripts/enrichment_queue.py).
# Results POST to https://buildingseattle.com (not workers.dev).
#
# Required repo secrets:
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare account ID
#   CLOUDFLARE_API_TOKEN   Token with D1 read scope for buildingseattle DB
#   INGEST_API_TOKEN       Token expected by the Worker /ingest endpoints
#
# A failed run opens (or comments on) a "[Workflow failure]" issue.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max new permits to enrich this run'
        default: '300'
        required: false
      stale_limit:
        description: 'Max stale (already enriched) permits to re-enrich (0 = none)'
        default: '100'
        required: false
      concurrency:
        description: 'Concurrent SDCI/L&I requests per chunk'
        default: '3'
        required: false

permissions:
  contents: read

concurrency:
  group: permit-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Run enrichment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          # Dispatch inputs go through env, never straight into the script.
          LIMIT: ${{ inputs.limit || '300' }}
          STALE_LIMIT: ${{ inputs.stale_limit || '100' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }}
        run: |
          for value in "$LIMIT" "$STALE_LIMIT" "$CONCURRENCY"; do
            [[ "$value" =~ ^[0-9]+$ ]] || { echo "inputs must be whole numbers" >&2; exit 2; }
          done
          uv run python scripts/enrich_unenriched.py \
            --limit "$LIMIT" \
            --stale-limit "$STALE_LIMIT" \
            --concurrency "$CONCURRENCY"

  notify:
    needs: [enrich]
    if: always() && needs.enrich.result != 'skipped'
    permissions:
      issues: write
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow: ${{ github.workflow }}
      result: ${{ needs.enrich.result }}
