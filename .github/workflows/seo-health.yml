name: Production SEO Health

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore crawl-health history
        uses: actions/cache/restore@v4
        with:
          path: .seo-health-history.jsonl
          key: seo-health-history-${{ github.run_id }}
          restore-keys: seo-health-history-

      - name: Check production SEO and crawl health
        id: health
        continue-on-error: true
        env:
          SEO_HISTORY_PATH: .seo-health-history.jsonl
        run: node scripts/check_seo_health.mjs

      - name: Publish actionable summary
        if: always()
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require("./seo-health-report.json");
          console.log("## Production SEO health");
          console.log(`**${report.summary.passed}/${report.summary.checks} checks passed** (${report.summary.failed} failed).`);
          if (report.trend.previous_generated_at) {
            const sign = report.trend.failed_delta > 0 ? "+" : "";
            console.log(`\nCompared with ${report.trend.previous_generated_at}: **${sign}${report.trend.failed_delta} failures**.`);
          }
          if (report.failures.length) {
            console.log("\n| Check | URL | Detail |");
            console.log("|---|---|---|");
            for (const failure of report.failures.slice(0, 25)) {
              console.log(`| ${failure.check} | ${failure.url} | ${String(failure.detail).replaceAll("|", "\\|")} |`);
            }
          }
          NODE

      - name: Upload historical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-health-${{ github.run_id }}
          path: seo-health-report.json
          retention-days: 90

      - name: Save crawl-health history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .seo-health-history.jsonl
          key: seo-health-history-${{ github.run_id }}

      - name: Open or resolve production SEO alert
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("seo-health-report.json", "utf8"));
            const title = "[SEO monitor] Production crawl-health failure";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (report.summary.failed) {
              const rows = report.failures.slice(0, 25).map((failure) =>
                `- **${failure.check}** — ${failure.url} — ${failure.detail}`
              ).join("\n");
              const body = `Automated production crawl on ${report.generated_at} found ${report.summary.failed} failures.\n\n${rows}\n\n[Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Recovered on ${report.generated_at}; all ${report.summary.checks} checks passed.` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
            }

      - name: Fail on crawl-health regressions
        if: steps.health.outcome == 'failure'
        run: exit 1
